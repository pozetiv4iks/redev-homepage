<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <section class="newsletter">
        <div class="newsletter__content">
            <div class="newsletter__text">
                <h2 class="newsletter__title">Be the first to know about new drops and exclusive offers!</h2>
                <p class="newsletter__subtitle">Subscribe to our newsletter for early access, special deals, and the latest trends.</p>
            </div>
            <form class="newsletter__form">
                <input type="email" class="newsletter__input" placeholder="Your Email">
                <button type="submit" class="newsletter__button">
                    SIGN UP
                    <svg class="newsletter__button-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </section>
</body>
</html>
