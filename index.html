<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignacio Lang - Profile</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="hero-background">
      <div class="hero-overlay"></div>
    </section>
    <div class="cards">
      <div class="container">
        <div class="card">
          <div class="card__wraper-image">
            <img src="bg.png" alt="Background" class="card-image" />
            <div class="card__social-icons">
              <a href="#" class="card__icon">
                <img src="facebook.png" alt="Facebook" />
              </a>
              <a href="#" class="card__icon">
                <img src="twitter.png" alt="Twitter" />
              </a>
              <a href="#" class="card__icon">
                <img src="linkedin.png" alt="LinkedIn" />
              </a>
              <a href="#" class="card__icon">
                <img src="instagram.png" alt="Instagram" />
              </a>
            </div>
          </div>
          <div class="card_info">
            <span class="card_name">Ignacio Lang</span>
            <p class="card_job">Founder & Lead Mechanic</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
